<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Moaby Consultoria</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-slate-900 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-5 flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold">Painel Administrativo</h1>
      <button id="logoutBtn" class="hidden bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-sm transition">Sair</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
    <!-- Login Admin -->
    <section id="loginSection" class="bg-white rounded-2xl shadow p-6 max-w-md mx-auto">
      <h2 class="text-lg font-semibold mb-4">Login do Personal</h2>
      <input id="adminEmail" type="email" placeholder="E-mail" class="w-full mb-2 px-3 py-2 border rounded-lg" />
      <div class="relative mb-3">
        <input id="adminPassword" type="password" placeholder="Senha" class="w-full pl-3 pr-10 py-2 border rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none" />
        <button type="button" class="togglePasswordBtn absolute inset-y-0 right-0 pr-3 flex items-center text-orange-500 hover:text-orange-600 focus:outline-none transition cursor-pointer" data-target="adminPassword" title="Mostrar/ocultar senha" aria-label="Mostrar ou ocultar senha">
          <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
          <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
        </button>
      </div>
      <button id="adminLoginBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-lg">Entrar</button>
      <p id="loginMsg" class="text-sm mt-3 text-red-600"></p>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" class="hidden space-y-8">
      <!-- Pedidos -->
      <div class="bg-white rounded-2xl shadow p-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
          <h2 class="text-lg font-semibold">Pedidos & Agendamentos</h2>
          <button id="refreshOrdersBtn" class="self-start sm:self-auto bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg shadow-sm transition flex items-center gap-1.5">
            🔄 Atualizar
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left border-b">
                <th class="py-2">Aluno</th>
                <th class="py-2">Serviço</th>
                <th class="py-2">Status</th>
                <th class="py-2">Data</th>
                <th class="py-2">Hora</th>
                <th class="py-2">Local</th>
                <th class="py-2">Criado em</th>
                <th class="py-2 text-right">Ação</th>
              </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Ficha de Treino -->
      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-lg font-semibold mb-4">Registrar Ficha de Treino</h2>
        <form id="workoutForm" class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="text-sm">ID do Aluno (userId)
              <input id="workoutUserId" type="text" required class="w-full mt-1 px-3 py-2 border rounded-lg" />
            </label>
          </div>
          <div>
            <label class="text-sm">Título da Ficha
              <input id="workoutTitle" type="text" required placeholder="Ex: Hipertrofia - Semana 1" class="w-full mt-1 px-3 py-2 border rounded-lg" />
            </label>
          </div>
          <div class="md:col-span-2">
            <label class="text-sm">Conteúdo da Ficha (exercícios, séries, repetições)
              <textarea id="workoutContent" rows="6" required placeholder="A - Supino Reto 4x10&#10;B - Crucifixo 3x12..." class="w-full mt-1 px-3 py-2 border rounded-lg"></textarea>
            </label>
          </div>
          <div class="md:col-span-2">
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg">Salvar Ficha</button>
            <span id="workoutMsg" class="ml-3 text-sm"></span>
          </div>
        </form>
      </div>

      <!-- Fichas existentes -->
      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-lg font-semibold mb-4">Fichas Registradas</h2>
        <div id="workoutsList" class="space-y-3"></div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('click', function (e) {
      const btn = e.target.closest('.togglePasswordBtn');
      if (!btn) return;
      const targetId = btn.getAttribute('data-target');
      const input = document.getElementById(targetId);
      if (!input) return;
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      const eyeOpen = btn.querySelector('.eye-open');
      const eyeClosed = btn.querySelector('.eye-closed');
      if (eyeOpen && eyeClosed) {
        eyeOpen.classList.toggle('hidden', isPass);
        eyeClosed.classList.toggle('hidden', !isPass);
      }
    });
  </script>
  <script type="module" src="./admin.js"></script>
</body>
</html>
